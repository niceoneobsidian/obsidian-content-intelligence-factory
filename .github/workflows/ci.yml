name: OCIF CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
    branches: [main, master, 'feat/**']

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 — lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocif_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ocif_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OCIF_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/ocif_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout pinned USIE producer for cross-repository contract tests
        uses: actions/checkout@v4
        with:
          repository: niceoneobsidian/universal-social-intelligence
          ref: 557c1e630aa3350489e675b66c1bcf5f1c72b76b
          path: usie
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,postgres]'
          python -m pip install -e ./usie
          # Exercise the actual OIS policy spine in the PostgreSQL vertical slice.
          python -m pip install "niceone-obsidian @ git+https://github.com/niceoneobsidian/niceone-obsidian.git@d60b3fd474917ee5f0bf46233ca58b4f56c0f40c"
      - name: Check lint
        run: python -m ruff check src tests
      - name: Run unit tests
        run: python -m pytest -v
